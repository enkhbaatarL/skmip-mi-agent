  mi_event_title_ko: 미국 Freeport LNG 가동 중단 및 파이프라인 제약으로 국내 가스 시장 영향
  mi_event_summary_ko: 3월 17일 텍사스 소재 Freeport LNG 시설의 액화 트레인이 일시적으로 가동을 중단하면서 미국의 LNG 수출 능력이 감소했습니다. 이로
    인해 국내 가스 수요가 줄어들어 Henry Hub 가격 상승 압력이 완화되는 효과가 나타났습니다. 동시에 노스다코타 지역에서는 파이프 동결로 인한 가스 공급 감소가 발생하여 일부
    가격 상승 압력으로 작용했습니다. 한편 Permian 지역에서는 파이프라인 제약으로 인해 생산된 가스가 West Texas 지역에 갇히는 현상이 발생했으며, 이로 인해 Waha
    Hub 가격이 28일 연속 마이너스를 기록하는 극단적인 지역적 공급 과잉 상황이 나타났습니다. EIA 보고에 따르면 2월 27일 기준 미국 천연가스 재고는 전주 대비 132 Bcf
    감소했으나, 전년 동기 대비로는 6.5% 증가한 수준을 유지하여 가격에 미치는 영향은 제한적이었습니다. 이러한 복합적인 요인들로 인해 Henry Hub 가격은 $3.01/MMBtu
    수준을 유지하며, JKM과의 스프레드가 극대화되어 미국 LNG 수출의 수익성이 크게 개선되었습니다.
