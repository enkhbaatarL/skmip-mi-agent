  mi_event_title_ko: 호르무즈 해협 봉쇄로 카타르·UAE LNG 수출 차단, 글로벌 공급 19% 중단
  mi_event_summary_ko: 중동 지역의 지정학적 긴장이 극도로 고조되면서 호르무즈 해협이 봉쇄되어 카타르와 UAE의 LNG 수출이 완전히 차단되었습니다. 이로 인해 글로벌
    LNG 공급의 19%가 중단되었으며, 주당 150만톤(2.2bcm)의 공급 차질이 발생하고 있습니다. 호르무즈 해협을 통과하는 연간 110bcm 규모의 LNG 물량이 영향을 받고
    있으며, 이는 전 세계 LNG 거래의 약 20%에 해당합니다. 특히 카타르와 UAE LNG 수출의 90%가 아시아향이었기 때문에 중동발 아시아향 LNG 화물 흐름이 완전히 차단되었습니다.
    Wood Mackenzie에 따르면 동북아시아 LNG 수요가 2026년 3분기까지 400-500만톤 감소할 것으로 예상되며, 대만은 카타르/UAE 의존도가 35%로 가장 큰 타격을
    받고 있습니다. 한국도 현물 노출이 20% 이상으로 전력회사들이 심각한 압박을 받고 있습니다. 가격 측면에서는 아시아 LNG 현물가격이 $20/MMBtu 이상으로 급등하여 유럽
    대비 디스카운트에서 프리미엄으로 전환되었으며, 지역간 가격 스프레드가 역전되었습니다. 미국의 신규 LNG 생산능력이 연간 15bcm에 불과해 중단된 110bcm을 대체하기에는
    크게 부족하며, 단기적으로는 수요 파괴가 유일한 해결책으로 제시되고 있습니다. 생산자들은 저장 제약을 관리하기 위해 상류 생산을 감소시킬 것으로 예상되며, 해협이 재개되더라도
    생산 회복에는 상당한 시간이 소요될 전망입니다.
