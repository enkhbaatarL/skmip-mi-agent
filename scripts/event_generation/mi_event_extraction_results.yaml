  mi_event_title_ko: 카타르 Ras Laffan LNG 시설 공습으로 생산 중단, 글로벌 공급 17% 차질
  mi_event_summary_ko: 이란에 대한 이스라엘과 미국의 공격이 확대되면서 이란이 보복으로 카타르의 세계 최대 LNG 수출 허브인 Ras Laffan Industrial
    City를 미사일로 공격했습니다. 이 시설은 연간 7,700만톤의 처리 능력을 보유하고 있었으나, 공격으로 인해 1,280만톤 규모의 생산설비가 완전히 파괴되었습니다. 이는 전
    세계 LNG 공급의 17-20%에 해당하는 막대한 규모입니다. Wood Mackenzie와 Rystad Energy에 따르면 월 6.7 MMt의 생산 차질이 발생했으며, 시설
    복구에는 최소 3년에서 최대 5년이 소요될 것으로 예상됩니다. 카타르 LNG 수출의 90%를 차지하는 아시아 구매자들이 가장 큰 타격을 받았으며, 특히 카타르/UAE 의존도가
    35%에 달하는 대만이 심각한 영향을 받고 있습니다. 한국도 현물 노출이 20% 이상으로 전력회사들이 압박을 받고 있습니다. 유럽의 이탈리아와 벨기에도 장기계약 공급 중단으로
    대체 공급원 확보에 나섰습니다. 가격 측면에서는 JKM이 하루 만에 $10 이상 급등하여 $22.35/MMBtu에 도달했으며, 이는 3년 만의 최고치입니다. Henry Hub는
    $3.01/MMBtu로 JKM과의 스프레드가 극대화되어 미국 LNG 수출 수익성이 크게 개선되었습니다. Morgan Stanley는 2026년 예상되었던 600만톤 규모의 공급
    과잉이 카타르 생산 중단으로 대부분 상쇄될 것으로 전망했습니다.
