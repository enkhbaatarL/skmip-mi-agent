  mi_event_title_ko: 호주 사이클론으로 주요 LNG 시설 가동 중단, 30MMtpy 이상 공급 차질
  mi_event_summary_ko: 3월 중순 호주 북서부 지역을 강타한 대형 사이클론으로 인해 호주의 주요 LNG 생산시설 4곳이 동시에 가동을 중단했습니다. 영향을 받은 시설은
    Chevron이 운영하는 Gorgon LNG(연간 15.6MMtpy)와 Wheatstone LNG(8.9MMtpy), Woodside가 운영하는 North West Shelf(14.3MMtpy),
    그리고 Santos가 운영하는 Darwin LNG(3.7MMtpy)입니다. 이들 시설의 총 생산능력은 연간 30MMtpy 이상으로, 전 세계 LNG 공급의 1/4 이상에 해당하는
    대규모 공급 차질이 발생했습니다. 사이클론의 영향으로 안전상의 이유로 시설들이 예방적으로 가동을 중단했으며, 이는 이미 타이트한 LNG 시장에 추가적인 공급 압박을 가했습니다.
    그러나 3월 29일 기상 상황이 개선되면서 시설들이 순차적으로 재가동되기 시작했고, 공급이 회복되면서 JKM 가격은 $20대 중반에서 $17대 후반으로 급락했습니다. 이번 사건은
    호주 LNG 공급의 기상 리스크에 대한 취약성을 다시 한번 부각시켰으며, 특히 사이클론 시즌 동안 호주 LNG 공급의 신뢰성에 대한 우려를 증가시켰습니다.
