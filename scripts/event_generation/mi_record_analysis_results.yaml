  title: Energy markets brace for a prolonged supply disruption
  body: "Energy markets are having to continuously price in a more prolonged disruption to oil and gas\n\
    flows through the Strait of Hormuz, with little sign of de-escalation.\n\nFor the global LNG market,\
    \ there is even less flexibility on the supply side, with the disruption\nin Persian Gulf flows hitting\
    \ around 20% of global LNG trade. New capacity ramping up in the US\nthis year at just 15 bcm of annual\
    \ capacity falls short of the 110 bcm of annual production\ncurrently disrupted. The only real solution\
    \ in the short term is demand destruction.\n\nING outlined three scenarios:\n- Scenario 1 (Base):\
    \ Hormuz flows remain cut off until end of March, gradual recovery in Q2.\n  Near-normal flows by\
    \ start of Q3 2026.\n- Scenario 2 (Optimistic): Quick de-escalation, energy flows back to near-normal\
    \ by May 2026.\n- Scenario 3 (Aggressive): Intense conflict continues into April, gradual recovery\
    \ June-August.\n\nA more prolonged disruption means producers will reduce upstream production to manage\
    \ storage\nconstraints, further prolonging recovery even after the Strait reopens.\n"
