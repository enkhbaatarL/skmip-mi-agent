[project]
name = "market-intelligence"
version = "0.1.0"
description = "Market Intelligence Chatbot Testboard"
readme = "README.md"
requires-python = ">=3.12,<4.0"

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E","W","F","I","UP","B","S","A","Q","N","RUF","D",
    "YTT","ANN","ASYNC","BLE","FBT","COM","C4","CPY","DTZ","T10","DJ","EM","EXE","INT",
    "ISC","ICN","LOG","G","INP","PIE","T20","PT","RSE","RET","SLF","SIM","SLOT","TID","TD",
    "TRIO","TCH","PTH","FLY","C90","PD","PERF","TRY","PGH"
]
ignore = [
    "ANN101",
    "D100","D101","D102","D103","D104","D105","D106","D107",
    "D202","D203","D213","D401","D402","TC002","BLE001","TC001",
    "TC003",
]
exclude = [
    "migrations","build","dist","node_modules","site-packages","venv",
    ".next",".pyenv",".pytest_cache",".pytype",".ruff_cache",".svn",".tox",".venv"
]
fixable = ["ALL"]
unfixable = []


[tool.ruff.isort]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
black = ">=25.1.0"
botocore = ">=1.38.15"
fastapi = {extras = ["standard"], version = ">=0.115.12"}
fastmcp = ">=2.3.3"
gunicorn = {version = ">=21.2.0", markers = "platform_system != 'Windows'"}
httpx = {extras = ["http2"], version = ">=0.27.2"}
loguru = ">=0.7.3"
python-dotenv = ">=1.1.1"
uvicorn = {extras = ["standard"], version = ">=0.30.6,<0.31.0"}
langchain-community = ">=0.4.2,<0.5.0"
langchain-openai = ">=1.3.3,<2.0.0"
langgraph = ">=1.2.7,<2.0.0"
mcp = ">=1.9,<2"
mlflow = {extras = ["auth"], version = ">=3.11.0,<4.0.0"}
numpy = ">=2.3.3"
openai = ">=1.78.1"
pandas = ">=2.3.2"
pydantic-ai = ">=0.2.3"
pymysql = ">=1.1.1"
scipy = ">=1.16.2"
sqlalchemy = ">=2.0.43"
sqlglot = ">=25.0.0,<26.0.0"
tabulate = ">=0.9.0"
tavily-python = ">=0.7.17"
openpyxl = "^3.1.5"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
      .git          # root of the project
    | venv
    | build
    | dist
  )/
'''

[tool.flake8]
show-source = true
exclude = [
  ".git",
  ".gitignore",
  "__pycache__",
  "venv",
  ".env.*",
  "build",
  "dist"
  ]
ignore = ["E501", "W503", "F401"]
#ignore = ["E501", "W503"]
#E501: line too long
#W503: line break occurred before binary operator
extend-ignore = "E203"
max-complexity = 10
max-line-length = 88

[tool.isort]
profile = "black"
multi_line_output = 3

#[tool.uv]
#index-url="https://skpc-nexus.skpc.cloudzcp.net/repository/pypi-sre-proxy/simple"

[dependency-groups]
dev = [
    "debugpy (>=1.8.21,<2.0.0)"
]
