apiVersion: v1
kind: ConfigMap
metadata:
  name: mi-agent-config
data:
  config.yaml: |
    METADATA_DB_TYPE: mysql
    METADATA_DB_HOST: ${METADATA_DB_HOST}
    METADATA_DB_PORT: ${METADATA_DB_PORT}
    METADATA_DB_NAME: ${METADATA_DB_NAME}
    METADATA_DB_USERNAME: ${METADATA_DB_USERNAME}
    METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD}

    DB_CONNECTION_TIMEOUT_SECONDS: 10
    READ_TIMEOUT_SECONDS: 30
    IS_DB_ECHO_LOG: false
    DB_POOL_SIZE: 5
    DB_POOL_OVERFLOW: 10
    DB_POOL_TIMEOUT_SECONDS: 30
    POOL_RECYCLE_SECONDS: 1800
    POOL_PRE_PING: true
    IS_DB_EXPIRE_ON_COMMIT: false

    ai_platform_host_url: https://aip-stg.sktai.io
    api_key: ${MODEL_API_KEY}

    model_endpoint: https://aip-stg.sktai.io/api/v1/gateway
    model_api_key: ${MODEL_API_KEY}
    model_api_deployment_name: "skmidev-gpt-5.5-20260424"
    lightly_thinking_model_api_deployment_name: "skmidev-gpt-5.5-20260424"
    deeply_thinking_model_api_deployment_name: "skmidev-gpt-5.5-20260424"

    MCP_POOL_URLS: {}
    COMPANY_MCP_MAP: {}
    mcp_pool_size: 10
    mcp_per_session_limit: 5
    mcp_client_timeout: 30
    mcp_client_sse_read_timeout: 60

    http_timeout: 60
    http_connect_timeout: 10
    http_verify: true
    http2: true
    http_max_connection: 100
    http_max_keepalive: 20

    rdb_search_metadata_repo_id: 00000000-0000-0000-0000-000000000000

    scenario_group_admin_bearer_tokens:
      - ${SCENARIO_GROUP_ADMIN_TOKEN}

    callback_oauth2_token_url: https://mi.mingovvv.info/api/v1/oauth2/token
    callback_oauth2_client_id: agent-skgas-client
    callback_oauth2_client_secret: ${CALLBACK_OAUTH2_CLIENT_SECRET}

    callback_base_url: https://mi.mingovvv.info
    callback_create_scenarios_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/generation/callback
    callback_validate_scenarios_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/validation/callback
    callback_create_signposts_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/signposts/callback
    callback_price_interpretations_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/price-interpretations/callback
    skip_callback: true

    llm_concurrency: 4
    llm_max_retries: 1
    model_parameter_max_parameter_slots: 100
    model_parameter_max_value_prompt_basecase_records: 100
    model_parameter_max_routing_candidates_per_dimension: 2
    mcp_max_concurrency: 8
    http_max_concurrency: 16
    rdb_exec_max_parallel: 4
    log_level: DEBUG
