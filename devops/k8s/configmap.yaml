apiVersion: v1
kind: ConfigMap
metadata:
  name: mi-agent-config
data:
  config.yaml: |
    METADATA_DB_TYPE: mysql
    METADATA_DB_HOST: ${METADATA_DB_HOST}
    METADATA_DB_PORT: ${METADATA_DB_PORT}
    METADATA_DB_NAME: ${METADATA_DB_NAME}
    METADATA_DB_USERNAME: ${METADATA_DB_USERNAME}
    METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD}

    DB_CONNECTION_TIMEOUT_SECONDS: 10
    READ_TIMEOUT_SECONDS: 30
    IS_DB_ECHO_LOG: false
    DB_POOL_SIZE: 5
    DB_POOL_OVERFLOW: 10
    DB_POOL_TIMEOUT_SECONDS: 30
    POOL_RECYCLE_SECONDS: 1800
    POOL_PRE_PING: true
    IS_DB_EXPIRE_ON_COMMIT: false

    ai_platform_host_url: https://aip-stg.sktai.io
    api_key: ${MODEL_API_KEY}

    model_endpoint: https://aip-stg.sktai.io/api/v1/gateway
    model_api_key: ${MODEL_API_KEY}
    model_api_deployment_name: "skmidev-gpt-5.6-sol-skgas"
    lightly_thinking_model_api_deployment_name: "skmidev-gpt-5.5-20260424"
    deeply_thinking_model_api_deployment_name: "skmidev-gpt-5.5-20260424"

    http_timeout: 60
    http_connect_timeout: 10
    llm_timeout_sec: 310
    llm_stream_enabled: true
    llm_reasoning_effort: default
    llm_v4_event_analysis_timeout_sec: 180
    llm_v4_stream_first_chunk_timeout_sec: 150
    llm_v4_stream_idle_timeout_sec: 90
    llm_verbosity: high
    llm_structured_output_strict: false

    # Web search
    web_search_provider: responses
    web_search_base_url: https://sk-mi-common-dev-oai-usea02-01.openai.azure.com/openai/v1
    web_search_model: "skmidev-gpt-5.5-20260424"
    web_search_context_size: medium
    web_search_max_results: 10
    web_search_score_threshold: 0.0
    web_search_reasoning_effort: medium
    web_search_tool_choice: required
    web_search_timeout_sec: 310
    web_search_max_retries: 2

    # MI MCP server
    mi_mcp_base_url: http://40.82.137.178:14180/mcp
    mi_mcp_timeout_sec: 60

    http_verify: true
    http2: true
    http_max_connection: 100
    http_max_keepalive: 20

    scenario_group_admin_bearer_tokens:
      - ${SCENARIO_GROUP_ADMIN_TOKEN}
    create_signposts_max_concurrent_scenarios: 7
    scenario_group_operation_heartbeat_interval_seconds: 30
    scenario_group_operation_stale_after_seconds: 120
    scenario_group_operation_reaper_interval_seconds: 30
    additional_dimension_stale_after_seconds: 240
    hide_price_pressure: true
    scenario_group_v4_impact_catalog_version: v4.1
    scenario_synthesis_policy: band_unique

    agents:
      scenario_group_agent:
        mlflow_experiment_name: scenario_agent_local
        aip_app_id: scenario_agent
        mlflow_tracing_enabled: true
      parameter_agent:
        mlflow_experiment_name: parameter_agent_local
        aip_app_id: parameter-agent-local
        mlflow_tracing_enabled: true
      default:
        mlflow_experiment_name: mi_agent_local
        aip_app_id: mi_agent
        mlflow_tracing_enabled: false

    mlflow_tracking_uri: "http://40.82.137.178:5001"
    mlflow_tracking_username: "skmip-mi-agent"
    mlflow_tracking_password: "skgas2ndfloor!"
    mlflow_langchain_run_tracer_inline: false

    callback_oauth2_token_url: https://mi.homil.co.kr/api/v1/oauth2/token
    callback_oauth2_client_id: agent-skgas-client
    callback_oauth2_client_secret: ${CALLBACK_OAUTH2_CLIENT_SECRET}

    callback_base_url: https://mi.homil.co.kr
    callback_create_scenarios_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/generation/callback
    callback_validate_scenarios_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/validation/callback
    callback_create_signposts_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/signposts/callback
    callback_price_interpretations_path: /api/v1/mi/next-gen/scenario-groups/{scenario_group_id}/price-interpretations/callback
    callback_model_parameter_proposals_path: /api/v1/mi/next-gen/scenarios/{scenario_id}/model-param-proposals/callback
    skip_callback: true

    llm_concurrency: 10
    llm_max_retries: 1
    model_parameter_proposal_flow_release: v4.1.9
    model_parameter_transient_retry_max_attempts: 2
    model_parameter_transient_retry_base_delay_seconds: 0.5
    model_parameter_transient_retry_max_jitter_seconds: 0.25
    model_parameter_lut_enabled: true
    model_parameter_lut_horizon_start_year: 2026
    model_parameter_lut_horizon_end_year: 2030
    model_parameter_basecase_value_max_decimal_places: 5
    model_parameter_basecase_value_precision_mode: trunc
    model_parameter_proposed_value_max_decimal_places: 5
    model_parameter_proposed_value_precision_mode: trunc
    model_parameter_max_parameter_slots: 100
    model_parameter_max_value_prompt_basecase_records: 100
    model_parameter_max_routing_candidates_per_dimension: 2
    model_parameter_v4_max_routing_candidates_per_dimension: 3
    model_parameter_max_conditional_parameters_per_scenario: 4
    model_parameter_variation_mode: balanced
    model_parameter_variation_profile_enabled: true
    model_parameter_grounded_slot_recovery_enabled: true
    model_parameter_max_total_selected_slots: 300
    model_parameter_max_step2_prompt_bytes: 327680
    model_parameter_max_step3_prompt_bytes: 327680
    model_parameter_resource_storage:
      enabled: true
      endpoint_url: http://mip-minio:9000
      region_name: us-east-1
      signature_version: s3v4
      bucket: sk-mi-d-osb-ss-skgas
      access_key_id: ${MODEL_PARAMETER_RESOURCE_STORAGE_ACCESS_KEY_ID}
      secret_access_key: ${MODEL_PARAMETER_RESOURCE_STORAGE_SECRET_ACCESS_KEY}
      local_root: /tmp/skmip/model-parameter-resources
      connect_timeout_seconds: 10
      read_timeout_seconds: 60
      max_attempts: 3
      bootstrap_timeout_seconds: 420
      lock_timeout_seconds: 500
    model_parameter_mi_base_fallback:
      no_active_case_mode: fail
      active_case_unavailable_mode: verified_cache
    model_parameter_resources:
      basecase:
        demand:
          path: Demand Model_Input.xlsm
          object_storage_path: fundamental_model_artifact/input_template/복호화_(Base) Demand Model_Input.xlsm
        supply:
          path: Supply Model_Input.xlsm
          object_storage_path: fundamental_model_artifact/input_template/복호화_(Base) Supply Model_Input.xlsm
        trade:
          path: Trade Model_Input.xlsm
          object_storage_path: fundamental_model_artifact/input_template/복호화_(Base) Trade Model_Input.xlsm

      workbook_contract:
        path: contracts/model-parameter-workbook-contract-v10.json

      proposal_capabilities:
        path: contracts/model-parameter-proposal-capabilities-v6.json
        release_id: extend17-v10
        sha256: 269fda833216a29fe52555e87be7f58d40ad514a97c6e0a78fa43dad170f78c4

      lut:
        Coal Futures Price:
          enabled: false
          adapter: futures_price
          files:
            values:
              path: Demand_Model_LUT_BCInput_value_based_t8.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_BCInput_value_based_t8.csv
              required_columns:
                - Futures pricing_Date
                - Futures pricing_Newcastle Coal
                - Futures pricing_Rotterdam Coal
                - Futures pricing_JKM
                - Futures pricing_TTF
          key_axes: [Month-Year, Region]

        Gas Futures Price:
          enabled: false
          adapter: futures_price
          files:
            values:
              path: Demand_Model_LUT_BCInput_value_based_t8.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_BCInput_value_based_t8.csv
              required_columns:
                - Futures pricing_Date
                - Futures pricing_Newcastle Coal
                - Futures pricing_Rotterdam Coal
                - Futures pricing_JKM
                - Futures pricing_TTF
          key_axes: [Month-Year, Region]

        GDP:
          enabled: true
          adapter: gdp_growth
          files:
            values:
              path: Demand_Model_LUT_BCInput_value_based_t2.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_BCInput_value_based_t2.csv
              required_columns:
                - RE Base Case GDP and Population Data_Country
                - RE Base Case GDP and Population Data_Year
                - RE Base Case GDP and Population Data_GDP
          key_axes: [Country, Year]

        PMI:
          enabled: true
          adapter: pmi_reference
          files:
            references:
              path: Demand_Model_Input_PMIInput_value_based_t1.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_Input_PMIInput_value_based_t1.csv
              required_columns:
                - Selection of PMI Reference Country_Demand Location_Continent
                - Selection of PMI Reference Country_Demand Location_Region
                - Selection of PMI Reference Country_Demand Location_Country
                - Selection of PMI Reference Country_Reference Country_Country
                - Selection of PMI Reference Country_Base Case Reference Country_Country
            values:
              path: Demand_Model_Input_PMIInput_value_based_t2.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_Input_PMIInput_value_based_t2.csv
              required_columns:
                - Base Case PMI Input (do not change)_Country
                - Base Case PMI Input (do not change)_Month
                - Base Case PMI Input (do not change)_{year}.0
          key_axes: [Country, Year, Month]

        PowerMix:
          enabled: true
          adapter: tabular
          layout: row
          files:
            values:
              path: Demand_Model_LUT_BCInput_value_based_t3.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_BCInput_value_based_t3.csv
              axis_columns:
                Country: Power Generation Data_Country
                Year: Power Generation Data_Year
                Energy Source: Power Generation Data_Energy Source Use
              value_column: Power Generation Data_Power Mix
          key_axes: [Country, Year, Energy Source]

        Temperature:
          enabled: true
          adapter: temperature_degree_days
          files:
            hdd:
              path: Demand_Model_Input_WeatherInput_value_based_t1.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_Input_WeatherInput_value_based_t1.csv
              required_columns:
                - Base Case HDD Input_Country
                - Base Case HDD Input_Month
                - Base Case HDD Input_{year}.0
            cdd:
              path: Demand_Model_Input_WeatherInput_value_based_t2.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_Input_WeatherInput_value_based_t2.csv
              required_columns:
                - Base Case CDD Input_Country
                - Base Case CDD Input_Month
                - Base Case CDD Input_{year}.0
          key_axes: [Country, Year, Month]

        Population:
          enabled: true
          adapter: population
          files:
            values:
              path: Demand_Model_LUT_BCInput_value_based_t2.csv
              object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_BCInput_value_based_t2.csv
              required_columns:
                - RE Base Case GDP and Population Data_Country
                - RE Base Case GDP and Population Data_Year
                - RE Base Case GDP and Population Data_Population (thousands)
          key_axes: [Country, Year]

        HurricaneIntensity:
          enabled: true
          adapter: hurricane_intensity
          files:
            intensity:
              path: BCHurricanes_Impacct_upstreamAssets.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCHurricanes_Impacct_upstreamAssets.csv
              required_columns:
                - Intensity
                - Pre-hurricane upstream production shut-in duration (No. of weeks in a month)
                - Pre-hurricane upstream production shut-in volume (% of total monthly volume)
                - During and post-hurricane upstream production shut-in duration (No. of weeks in a month)
                - During and post-hurricane upstream production shut-in volume (% of total monthly volume)
                - Net impact (Monthly upstream production decrease by %)
            plants:
              path: BCHurricanes_GoM.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCHurricanes_GoM.csv
              required_columns:
                - Liquefaction plants impacted by a hurricane in GoM
                - Impacted by hurricane?
          key_axes: [Year, Month]

        LiqProdAdjustment:
          enabled: true
          adapter: liq_prod
          files:
            values:
              path: BCLiquefaction.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCLiquefaction.csv
              required_columns:
                - Country
                - Plant Name
                - Plant Train
                - Year
                - Month
                - Period
                - Infra Life Cycle
                - LNG train capacity (Million tonnes LNG per month)
                - LNG plant utilisation %
          key_axes: [Country, LNG Plant, LNG Plant Train, Year, Month]
          metadata_axes:
            - Period
            - Life Cycle Category
            - Nameplate Capacity (MTPA)

        LiqUtilAdjustment:
          enabled: true
          adapter: liq_util
          files:
            values:
              path: BCLiquefaction.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCLiquefaction.csv
              required_columns:
                - Country
                - Plant Name
                - Plant Train
                - Year
                - Month
                - Period
                - Infra Life Cycle
                - LNG train capacity (Million tonnes LNG per month)
                - LNG plant utilisation %
          key_axes: [Country, LNG Plant, LNG Plant Train, Year, Month]
          metadata_axes:
            - Period
            - Life Cycle Category
            - Nameplate Capacity (MTPA)

        PipelineAdjustment:
          enabled: true
          adapter: pipeline
          files:
            values:
              path: BCPipeline.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCPipeline.csv
              required_columns:
                - Year
                - Major pipeline
                - From country
                - To country
                - Pipeline capacity (Bcm)
          key_axes: [Pipeline Name, From Country, To Country, Year, Month]

        SupplyDisruption:
          enabled: true
          adapter: supply_disruption
          files:
            production:
              path: BCProduction.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/BCProduction.csv
              required_columns:
                - Year
                - Country
                - Province/Basin
                - Life Cycle Category
                - Oil and gas detail
                - Base case supply (Bcm)
            seasonality:
              path: SeasonalityLogic.csv
              object_storage_path: fundamental_model_artifact/LUT/supply/supply_bc/SeasonalityLogic.csv
              required_columns:
                - Year
                - Month
                - Period
                - Province
                - PNG/LNG
                - Seasonality
          key_axes: [Country, Year, Month]

      references:
        demand_general_country_list:
          path: Demand_Model_LUT_General_value_based_t6.csv
          object_storage_path: fundamental_model_artifact/LUT/demand/Demand_Model_LUT_General_value_based_t6.csv
          required_columns:
            - Full Country List_Continent
            - Full Country List_Region
            - Full Country List_Country
    http_max_concurrency: 20
    log_level: DEBUG
