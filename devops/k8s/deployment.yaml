apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-agent
  labels:
    app: mi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-agent
  template:
    metadata:
      labels:
        app: mi-agent
    spec:
      containers:
        - name: mi-agent
          image: skmip-mi-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_CONFIG
              value: /workdir/config.yaml
            - name: APP_HOST
              value: 0.0.0.0
            - name: APP_PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: mi-agent-env
          volumeMounts:
            - name: app-config
              mountPath: /workdir/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: mi-agent-config
