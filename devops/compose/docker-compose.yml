name: skmip

version: "3.9"

services:
  scenario-group-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: skmip-mi-agent:local
    ports:
      - "8000:8000"
    env_file:
      - ../../envs/.env
    environment:
      METADATA_DB_HOST: host.docker.internal
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    restart: unless-stopped
