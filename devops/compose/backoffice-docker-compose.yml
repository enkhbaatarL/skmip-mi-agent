name: backoffice

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    env_file:
      - .env
    ports:
      - "0.0.0.0:${MLFLOW_PORT:-5001}:${MLFLOW_PORT:-5001}"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - mlflow-auth:/mlflow/auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      METADATA_DB_HOST: ${METADATA_DB_HOST:-host.docker.internal}
      METADATA_DB_PORT: ${METADATA_DB_PORT:-23009}
      METADATA_DB_USERNAME: ${METADATA_DB_USERNAME}
      METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD}
      MLFLOW_MYSQL_DB: mlflow
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: 5001
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-1}
      MLFLOW_AUTH_CONFIG_PATH: /mlflow/auth/basic_auth.ini
      MLFLOW_AUTH_ADMIN_USERNAME: ${MLFLOW_AUTH_ADMIN_USERNAME:-skmip-mi-agent}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_AUTH_ADMIN_PASSWORD:-skgas2ndfloor!}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:-skmip-mi-agent-local-mlflow-csrf-secret}
      MLFLOW_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,40.82.137.178:5001
      MLFLOW_CORS_ALLOWED_ORIGINS: http://localhost:5001,http://127.0.0.1:5001,http://40.82.137.178:5001
      
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir pymysql 'mlflow[auth]==3.14.0'
        mkdir -p /mlflow/auth
        python -c "import os, re, pymysql; db=os.getenv('MLFLOW_MYSQL_DB', 'mlflow'); [(_ for _ in ()).throw(ValueError(f'invalid database name: {db}'))] if not re.fullmatch(r'[A-Za-z0-9_]+', db) else None; conn=pymysql.connect(host=os.getenv('METADATA_DB_HOST', 'host.docker.internal'), port=int(os.getenv('METADATA_DB_PORT', '3307')), user=os.getenv('METADATA_DB_USERNAME'), password=os.getenv('METADATA_DB_PASSWORD'), autocommit=True); conn.cursor().execute(f'CREATE DATABASE IF NOT EXISTS {db} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); conn.close()"
        export MLFLOW_BACKEND_STORE_URI="mysql+pymysql://$${METADATA_DB_USERNAME}:$${METADATA_DB_PASSWORD}@$${METADATA_DB_HOST:-host.docker.internal}:$${METADATA_DB_PORT:-3307}/$${MLFLOW_MYSQL_DB:-mlflow}"
        cat > "$${MLFLOW_AUTH_CONFIG_PATH}" <<EOF
        [mlflow]
        default_permission = READ
        database_uri = sqlite:////mlflow/auth/basic_auth.db
        admin_username = $${MLFLOW_AUTH_ADMIN_USERNAME}
        admin_password = $${MLFLOW_AUTH_ADMIN_PASSWORD}
        authorization_function = mlflow.server.auth:authenticate_request_basic_auth
        grant_default_workspace_access = true
        EOF
        mlflow server \
          --app-name basic-auth \
          --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "$${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host "$${MLFLOW_HOST}" \
          --port "$${MLFLOW_PORT}" \
          --workers "$${MLFLOW_WORKERS}" \
          --allowed-hosts "$${MLFLOW_ALLOWED_HOSTS}" \
          --cors-allowed-origins "$${MLFLOW_CORS_ALLOWED_ORIGINS}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ.get('MLFLOW_PORT', '5001')}/health\")",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  mlflow-artifacts:
  mlflow-auth:
