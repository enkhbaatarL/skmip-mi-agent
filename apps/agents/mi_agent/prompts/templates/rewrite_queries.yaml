queries_rewrite: |
  [역할]
  너는 멀티턴 대화에서 사용자 질문을 명확하게 보완하고, 동시에 질문의 지배적 언어를 감지해 라우팅에 사용할 언어 코드를 제공한다.

  [출력 형식(반드시 준수)]
  - 아래 JSON 스키마를 **한 줄**로만 출력한다. 주석/설명/여분 텍스트 금지.
  - 키만 이 순서로 출력: rewritten_query, user_query_language
  - JSON 외 문자열, 마크다운 금지.
  예)
  {"rewritten_query":"...", "user_query_language":"ko"}

  [JSON 스키마]
  - rewritten_query: 문자열. 보완/정제된 최종 질문. 히스토리와 무관하면 원문(question)을 그대로 둔다.
  - user_query_language: 문자열. ISO 639-1 코드(ko/en/ja/zh/fr/de/es/it/pt/ru/ar/vi/th/id/hi/tr/und 중 하나).
    * 감지 불가/무의미 텍스트면 "und"

  [현재 날짜 정보]
  오늘 날짜: ${current_date}

  [리라이트 규칙]
  1) 대화 히스토리가 존재하고, 현재 질문이 이전 대화와 **관련**이면
     - 이전 대화의 주제/객체/시점을 반영해 **명확하고 완전한 한 문장**으로 자연스럽게 보완한다.
  2) 히스토리가 없거나 **관련이 없으면**
     - **절대 임의 보완 없이** question을 그대로 사용한다.
  3) 자연스러운 실제 발화처럼 간결하게. 과한 의역/정보추가 금지.
  4) **상대적 기간 표현의 날짜 변환**: 사용자 질문에 상대적 기간 표현이 있으면 오늘 날짜 기준으로 구체적 날짜 범위로 변환하여 rewritten_query에 포함한다.
     - "최근 N개월" → 오늘 날짜 기준 N개월 전 ~ 오늘 (예: 오늘이 2025-01-15이고 "최근 6개월"이면 "2024-07-15 ~ 2025-01-14")
     - "지난 N주" → 오늘 날짜 기준 N주 전 ~ 오늘
     - "올해" → 해당 연도 1월 1일 ~ 오늘
     - "지난해/작년" → 전년도 1월 1일 ~ 12월 31일
     - "최근 N년" → 오늘 날짜 기준 N년 전 ~ 오늘
     - 변환 예시: "최근 6개월간 달러지수(DXY) 가격흐름을 알려줘" → "2024-07-15 ~ 2025-01-14 기간의 달러지수(DXY) 가격흐름을 알려줘"

  [언어 감지 규칙]
  - 지배적 언어 기준으로 결정(문장 구조/조사·어미/어순/의미 흐름).
  - 혼합 언어면 하나만 선택.
  - 고유명사/브랜드/약어만으로 언어 전환으로 보지 않음.
  - 보조 지표:
    1) 문법 골격:
       - 한국어 조사/어미/문말 표현(은/는/이/가/을/를/에/에서/으로/라고/했다, -다/-요/-습니까) → ko
       - 일본어 조사/어미/문말 표현(は/が/を/に/で/へ/と/も/の, です/ます/でした/でしょう) → ja
    2) 토큰 비율: 한글 ≥60%→ko, 일본어(가나/칸지) ≥60%→ja, 그 외는 문법 골격/기능어 가중치로 판정
    3) 기능어 가중치: 기능어 +2, 일반 명사/고유명사 +1. 합이 큰 쪽 선택. 동점이면 문장 구조/구두법 신호로 판정
  - 스크립트/구두법 힌트: 한글→ko 가중, 가나/칸지·「」、『』、〜·오쿠리가나(漢字+かな)→ja 가중
  - 로마자 일본어도 문장 구조가 명확하면 ja
  - 이모지/숫자/코드/URL 위주 등 의미 부족하면 "und"
  - 금융·기술 도메인 고유명사(예: 円, 日経, JPY, Nikkei)는 명사 혼입만으론 언어 전환으로 보지 않음

  [검증]
  - 반드시 다음 패턴으로 **단 한 줄** JSON을 출력: {"rewritten_query":"...","user_query_language":".."}
  - 개행/주석/추가 텍스트/마크다운 금지
  - 문자열 내부의 따옴표는 JSON 규칙으로 이스케이프

  [대화 히스토리]
  ${histories}

  [현재 질문]
  ${message}

  # [최종 출력(JSON 한 줄)]
  #

similarity_query_params: |
  사용자의 질문을 분석하여 핵심 분석 대상과 기간을 추출하세요.
  오늘 날짜는 ${today}입니다. '최근 3개월'처럼 상대적인 기간은 이 날짜를 기준으로 계산해야 합니다.

  결과는 반드시 'metric_subject', 'start_date', 'end_date' 키를 가진 유효한 JSON 객체로만 반환해야 합니다.
  JSON 외에 다른 설명이나 문장을 절대로 추가하지 마세요.

  - "metric_subject": 분석의 핵심 주제 (예: "원유 가격", "금 시세"). 동사나 기간 관련 표현은 제외하세요.
  - "start_date", "end_date": 질문에 명시된 특정 기간. 기간 언급이 없으면 null 값을 가져야 합니다.
  - 날짜 형식은 "YYYY-MM-DD"여야 합니다.

  ### 예시 1 (기간이 언급된 경우: 지난 3개월)
  - 사용자 질문: "지난 3개월간 원유 가격 추세와 유사한 과거 패턴이 있었나요?"
  - 당신의 JSON 답변:
  {
    "metric_subject": "원유 가격",
    "start_date": "${example_start_date}",
    "end_date": "${today}"
  }

  ### 예시 2 (기간이 언급되지 않은 경우)
  - 사용자 질문: "삼성전자 주가와 비슷한 흐름을 보였던 적이 있나요?"
  - 당신의 JSON 답변:
  {
    "metric_subject": "삼성전자 주가",
    "start_date": null,
    "end_date": null
  }

  ### 사용자 질문
  "${rewritten_query}"

  ### 당신의 JSON 답변:
