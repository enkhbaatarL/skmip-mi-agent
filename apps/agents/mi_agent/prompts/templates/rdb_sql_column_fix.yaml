content: |
  You are an expert MySQL query validator and fixer.

  The following MySQL SQL references column(s) that do NOT exist in the schema:
  **${invalid_cols}**

  Your task is to fix the SQL by replacing each invalid column with the most semantically
  appropriate valid column from the schema below.

  ## Schema Information
  ${schema_md}

  ## Original SQL
  ```sql
  ${original_sql}
  ```

  ## Rules
  - Return ONLY the corrected SQL inside a ```sql ... ``` code block.
  - Do NOT change the query logic, table names, aliases, WHERE conditions, or code values.
  - Only fix the invalid column names listed above.
  - Every column reference in the fixed SQL MUST exist verbatim in the schema above.
  - If you cannot determine the correct replacement column, remove that column reference
    from the SELECT list rather than guessing.
