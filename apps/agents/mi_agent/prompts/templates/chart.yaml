timeseries: |
  다음은 사용자 질문, 관련 데이터입니다.

  ## 사용자 질문:
  ${message}

  ## 관련 데이터:
  ### 우선 활용 소스 : ${main_source}
  ### 보조 활용 소스 : ${sub_source}

  출처: ${source}

  위 정보를 바탕으로 사용자 질문과 분석 응답에 대한 **시계열 인사이트 데이터**를 생성해주세요.

  ---

  ## 출력 형식: TimeSeriesInsights

  데이터는 **TimeSeriesInsights 스키마**를 따르는 JSON 객체로 작성해주세요.

  ### TimeSeriesInsights JSON Schema
  ${schema}

  ---

  ## 필드별 작성 지침

  ### 1. key_indicators (주요 지표) - 필수
  수치데이터에서 핵심 지표를 추출하여 다음 형식으로 작성:
  - **label** (필수): 지표 라벨 (예: "최고가", "최저가", "평균", "최신값")
  - **value** (필수): 지표 값 (숫자)
  - **date** (옵션): 해당 값의 기준 날짜 (YYYY-MM-DD)
  - **unit** (옵션): 단위 (예: "USD/bbl", "pts", "원/달러")
  - **sources** (옵션): 데이터 출처 식별자 목록

  예시:
  ```json
  {
    "label": "최고가",
    "value": 91.0,
    "date": "2025-04-01",
    "unit": "USD/bbl",
    "sources": ["S1", "S3"]
  }
  ```

  ### 2. timeline_highlights (시계열 하이라이트) - 시계열 데이터가 있는 경우
  주요 날짜별 이벤트/변곡점을 테이블 형식으로 작성:

  **columns**: 컬럼 정의 목록
  - key: 컬럼 식별자 (date, value, event 등)
  - label: 표시 라벨
  - type: 데이터 타입 (date, number, string)
  - unit: 단위 (옵션, number 타입에만)

  **rows**: 주요 날짜별 데이터
  - date (필수): 날짜 (YYYY-MM-DD)
  - value (필수): 해당 날짜의 값
  - event (옵션): 주요 이벤트/원인 설명
  - sources (옵션): 출처 식별자 목록

  예시:
  ```json
  {
    "columns": [
      { "key": "date", "label": "날짜", "type": "date" },
      { "key": "value", "label": "종가", "type": "number", "unit": "USD/bbl" },
      { "key": "event", "label": "주요 이벤트/원인", "type": "string" }
    ],
    "rows": [
      {
        "date": "2025-04-01",
        "value": 91.0,
        "event": "연휴 효과, 지정학적 리스크",
        "sources": ["S2", "S4"]
      }
    ]
  }
  ```

  ### 3. charts (차트 데이터) - 필수
  시계열 차트용 데이터:
  - **order**: 차트 순서 (1부터 시작)
  - **legend**: 시리즈 범례명 (예: "브렌트유 가격 (USD/bbl)")
  - **date**: 날짜 리스트 (YYYY-MM-DD 형식, 시간순 정렬)
  - **value**: 값 리스트 (date와 동일한 길이)

  ### 4. 메타 정보 - 필수
  - **requested_range**: 사용자 요청 기간 (예: "2025-04-01 ~ 2026-01-23")
  - **available_range**: 실제 데이터 가용 기간 (예: "2025-04-01 ~ 2026-01-23")
  - **primary_value_field**: 대표 값 필드명 (예: "price", "close")
  - **unit**: 대표 단위 (예: "USD/bbl")

  ---

  ## 작성 시 주의사항

  1. **데이터 정확성**
     - 관련 데이터에 수치 값이 없다면 빈 배열/null로 처리
     - 주어진 데이터를 최대한 활용
     - 날짜는 데이터에 **명확히 언급된 날짜들만** 사용
     - 임의의 날짜나 값을 추가하지 말 것

  2. **날짜 형식**
     - 모든 날짜는 "YYYY-MM-DD" 형식
     - 시간이 빠른 순으로 정렬

  3. **수치 형식**
     - 모든 수치는 float 형식
     - date와 value 리스트의 길이는 반드시 일치

  4. **key_indicators 추출 기준**
     - 최고값/최저값/최신값/평균값 등 핵심 지표 추출
     - 각 지표에 해당하는 날짜와 단위 명시

  5. **timeline_highlights 추출 기준**
     - 급변동 시점, 변곡점, 특이점 위주로 추출
     - 최대 5-10개의 주요 날짜만 포함
     - 이벤트 설명은 데이터에서 확인 가능한 내용만 작성

  6. **기간 정합성**
     - requested_range: 사용자 질의에서 요청한 기간
     - available_range: 실제 데이터에서 확인 가능한 기간
     - 두 기간이 다를 경우 정확히 구분하여 기재

similarity: |
  다음은 사용자 질문, 시계열 데이터입니다.

  ## 사용자 질의
  ${message}

  ## 현재 시계열 데이터
  ${current_data}

  ## 과거 유사 패턴 시계열
  ${historical_data}

  ---

  ## 목적
  아래 정보를 바탕으로 **시계열 인사이트 데이터**를 생성하세요.

  ---

  ## 출력 형식: TimeSeriesInsights

  데이터는 **TimeSeriesInsights 스키마**를 따르는 JSON 객체로 작성해주세요.

  ### TimeSeriesInsights JSON Schema
  ${schema}

  ---

  ## 필드별 작성 지침

  ### 1. key_indicators (주요 지표)
  현재 패턴과 유사 패턴의 핵심 지표를 추출:
  - **label** (필수): 지표 라벨 (예: "현재 패턴 최고가", "유사 패턴 #1 최고가")
  - **value** (필수): 지표 값
  - **date** (옵션): 해당 값의 기준 날짜 (YYYY-MM-DD)
  - **unit** (옵션): 단위
  - **sources** (옵션): 데이터 출처 식별자 목록

  ### 2. timeline_highlights (시계열 하이라이트)
  현재/과거 패턴의 주요 변곡점을 테이블 형식으로 작성:

  **columns**: 컬럼 정의 목록
  **rows**: 주요 날짜별 데이터 (date, value, event, sources)

  ### 3. charts (차트 데이터) - 필수

  1. **현재 패턴 시계열**
     - legend: "Current pattern"으로 고정
     - '현재 시계열 데이터'의 date/value를 그대로 사용

  2. **과거 유사 패턴 시계열**
     - 각 유사 구간별로 legend를 "Similar Historical Patterns #N"으로 지정
     - 각 구간의 전체 date/value 리스트를 그대로 사용
     - 반드시 모든 유사 구간을 각각 별도의 시계열로 생성

  ### 4. 메타 정보
  - **requested_range**: 현재 패턴의 기간
  - **available_range**: 실제 데이터 가용 기간
  - **primary_value_field**: 대표 값 필드명
  - **unit**: 대표 단위

  ---

  ## 작성 시 주의사항

  1. **데이터 정확성**
     - 반드시 위에서 제공된 전체 데이터를 사용
     - 각 유사 패턴의 dates와 values 리스트는 원본 데이터의 전체 길이를 유지

  2. **날짜 형식**
     - 모든 날짜는 "YYYY-MM-DD" 형식
     - 시간이 빠른 순으로 정렬

  3. **수치 형식**
     - 모든 수치는 float 형식
     - 각 시계열의 date와 value 리스트의 길이는 반드시 동일
     - 빈 리스트는 절대 포함하지 않음

  4. **legend 규칙**
     - 현재 패턴: "Current pattern"
     - 유사 패턴: "Similar Historical Patterns #1", "Similar Historical Patterns #2" ...

  5. **key_indicators 추출 기준**
     - 현재 패턴의 최고/최저/시작/종료 값
     - 각 유사 패턴의 유사도 점수 및 주요 값

  6. **포맷 검증**
     - 포맷이 맞지 않거나 조건을 만족하지 않으면 재생성
