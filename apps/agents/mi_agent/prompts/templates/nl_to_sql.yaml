  - **Step 0 — Column allowlist is already built**: The "Column Allowlist" section at the top of this prompt contains the exact column names extracted from `${column_names_json}`. Use ONLY those names. Do NOT derive additional names from Schema information — the allowlist is authoritative and complete.
