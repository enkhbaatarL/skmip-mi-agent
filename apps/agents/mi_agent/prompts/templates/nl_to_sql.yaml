  - **[WHERE Clause Gate — Chosen Table] Re-check the WHERE clause separately against the chosen table schema. Every identifier used as a WHERE-column must exist verbatim in the chosen table's `columns[].name`. If even one WHERE-column is missing, the SQL is invalid and must be regenerated before output.**
  - **[Time-Key Gate] If the query requires period/date filtering, the WHERE clause uses a real allowlisted time column. Audit columns such as `crt_dtm` and `mod_dtm` are excluded unless explicitly defined as business observation time. If exactly one non-audit datetime/date column exists, it must be used.**
  - **[No Semantic Hallucination] No business-concept column name derived from the user query (e.g., price, shipment, volume, sales, close_price, metric_value, trade_date, base_date, obs_date) appears in the SQL unless it exists verbatim in `${column_names_json}`.**
  - **[Fallback Compliance] If no explicit semantic match existed for the requested metric, the SQL uses an existing generic numeric column selected via 3-1-β instead of inventing a new domain-specific column.**
