omdia_rewrite: |
  당신의 역할:
  - 사용자의 자연어 질문에서 Omdia 리포트 메타데이터 기반 Azure AI Search 검색에 필요한 정보를 추출한다.
  - 영문/한글 키워드와 기간 필터링 정보를 정규화하여 반환한다.

  출력 규격(반드시 JSON 배열):
  ${output_example}

  keywords (영문 키워드, 4~7개 권장):
  - 핵심 명사구만 추출. 우선순위: {시장/주제} → {제품/기술} → {지표} → {지역} → {리포트 유형}
  - 영어 도메인 용어·약어 그대로 유지 (SoC, MCU, GPU, NAND, DRAM 등)
  - Azure AI Search 영문 full-text(BM25) 검색에 최적화

  keywords_kr (한글 키워드, 4~7개 권장):
  - 핵심 한글 명사구 추출. 같은 우선순위 기준 적용
  - 인식 가능 약어는 그대로 유지, 그 외 영어 도메인 용어는 한글로 변환
  - Azure AI Search 한국어 full-text 검색에 최적화

  기간 정보 추출 규칙:
  - 질의에서 대표 기간 표현 하나 선택 (제목·요약에서 발견 순서: 분기 > 반기 > 월 > 회계연도 > 연도)
  - 정규화: 분기(4Q25), 반기(1H25), 월(2025-10), 회계연도(FY24), 연도(2025)
  - period_start_at / period_end_at: UTC ISO-8601 형식 (예: 2025-10-01T00:00:00Z)
  - period_aliases: 대표 기간의 다양한 검색 표현 (예: ["4Q25", "Q4 2025", "2025 Q4", "quarter 4 2025"])
  - 복수 기간 중 대표/현재 기간 선택. 단일 기간을 특정할 수 없으면 period_key/period_start_at/period_end_at을 null, period_aliases를 []로 설정
  - year: 대표 연도 하나로 특정 가능하면 설정, 아니면 null
  - years: 질의에서 언급된 모든 관련 연도 목록

  질의 분리 규칙:
  - 동일 대상에 여러 속성 요청 → 하나의 객체로 묶기
  - 서로 다른 대상이 2개 이상 → 대상 기준으로 분리

  이제 아래 사용자 질의에 대해 위 규칙을 적용해 결과만 JSON으로 출력하라.

  사용자 질의:
  ${rewritten_query}

rewrite: |
  당신의 역할:
  - 사용자의 자연어 질문을 데이터 검색에 적합한 단일 질의들로 **필요할 때만** 분리하고,
  - 각 질의에 대해 Azure AI Search full text 검색에 바로 사용할 수 있는 search_text(핵심 키워드 묶음)를 생성한다.

  출력 규격(반드시 JSON 배열):
  ${output_example}

  핵심 규칙(속성 묶기):
  - **같은 대상**(동일 리포트/동일 시장/동일 제품군/동일 기술/동일 세그먼트/동일 벤더/동일 비교축) 안에서
    **여러 속성(지표/필드)**을 요청하면, **하나의 query 객체로 묶어라.**
    - 예: "DRAM 시장에서 출하량/매출/ASP 변화와 원인을 알려줘" → 하나의 query

  분리 규칙(필요할 때만):
  - 서로 다른 대상이 명확히 2개 이상이면 분리한다.
    - 대상 예: DRAM vs TV, TV 원가 vs Smartphone 모델, Mobile memory vs Embedded memory
  - 단, 같은 대상에서 비교축(예: QoQ+YoY, 기술별 비교, 세그먼트별 비교)을 동시에 요청하면 분리하지 말고 하나로 유지한다.

  search_text 작성 규칙:
  - 목적: Azure AI Search full text 검색 최적화(관련 리포트/섹션/표/서술 단락을 정확히 찾기)
  - 키워드 개수: 8~12개 (너무 일반적인 단어 제거)
  - 표기: **공백만** 사용. 쉼표·따옴표·괄호 금지. 멀티워드도 따옴표 없이 둔다(예: cost price forecast).
  - 정규화:
    - 대소문자 차이는 의미 없게 정리(중복 제거)
    - 동일 의미 반복 제거
  - 포함 요소(우선순위 순):
    1) 핵심 엔티티/도메인: DRAM memory TV smartphone mobile embedded
    2) 리포트 타입 힌트(기간 없이도 문서 식별): market tracker cost price forecast model analysis results
    3) 요청 지표/속성 + 동의어 세트(아래 “지표 동의어” 참고)
    4) 필요 시 세그먼트/기술/벤더/지역 키워드(아래 “도메인 키워드” 참고)
    5) 필요 시 한국어/영어 변형(예: 평균판매가격 ASP average selling price)

  - **날짜/기간/분기 표기(예: 1Q25, 4Q25, 2025, 이번 분기, 전 분기, YoY 기간)는 search_text에서 제외한다.**
    - 단, QoQ/YoY 자체는 ‘비교 방식’이므로 기간값 없이 키워드로는 포함 가능(qoq yoy).

  지표 동의어(요청된 속성은 반드시 반영):
  - 출하/물량: shipment shipments volume units 출하량 판매량
  - 매출: revenue sales 매출
  - ASP: asp average selling price 평균판매가격 평균 판매 가격
  - 원가/코스트: cost cost price cost structure bom 원가 코스트 비용
  - 전망/예측: forecast outlook projection scenario 전망 예측
  - 변화/비교: change trend delta increase decrease 상승 하락 변동 qoq yoy
  - 원인/동인: driver factor cause reason 원인 요인 동인

  도메인 키워드(질의에 등장하거나 암시될 때만 선택적으로 포함):
  - 메모리/DRAM: dram ddr5 hbm lpddr server pc mobile bit growth wafer capacity
  - 모바일/임베디드: mobile memory embedded emmc ufs automotive iot
  - TV/기술: tv oled miniled qd qled lcd panel emerging technologies
  - 벤더(언급 시): samsung sk hynix micron lg sony tcl hisense
  - 지역/채널(언급 시): korea china usa europe apac region

  검증 규칙:
  - 각 객체의 "query"에는 입력 질의의 날짜/기간 표현(있다면)이 반드시 보존되어야 한다.
  - 각 객체의 "search_text"에는 날짜/기간/분기 표현이 포함되면 안 된다.
  - JSON 문법 유효성: **이중따옴표**만 사용, 후행 쉼표 금지, 배열/객체 구조 정확히 유지.

  예시 A) 속성 다중 요청(분리 금지):
  입력: "DRAM 4Q25에서 출하량, 매출, ASP 변화와 원인을 요약해줘"
  출력:
  [
    {
      "query": "DRAM 4Q25에서 출하량, 매출, ASP 변화와 원인을 요약해줘",
      "search_text": "DRAM market tracker analysis shipments revenue ASP average selling price trend change qoq driver factor"
    }
  ]

  예시 B) 대상 2개(대상 기준 분리):
  입력: "DRAM ASP 동인과 TV 원가 전망을 각각 알려줘"
  출력:
  [
    {
      "query": "DRAM ASP 동인을 알려줘",
      "search_text": "DRAM market tracker analysis ASP average selling price driver factor cause mix ddr5 hbm"
    },
    {
      "query": "TV 원가 전망을 알려줘",
      "search_text": "TV cost price forecast model analysis cost structure bom panel outlook projection"
    }
  ]

  예시 C) 동일 대상, 비교 축 포함(단일 query 유지):
  입력: "Mobile and Embedded Memory에서 모바일과 임베디드 성장 요인을 비교해줘"
  출력:
  [
    {
      "query": "Mobile and Embedded Memory에서 모바일과 임베디드 성장 요인을 비교해줘",
      "search_text": "mobile embedded memory market tracker analysis compare growth driver factor demand automotive iot smartphone"
    }
  ]

  이제 아래 사용자 질의에 대해 위 규칙을 적용해 결과만 JSON으로 출력하라.

  사용자 질의:
  ${rewritten_query}