  ## 구조화된 데이터 추출 (필수)

  **중요**: 위의 분석 답변 작성 후, 반드시 아래 JSON 블록을 마지막에 추가하세요.
  이 JSON은 UI에서 핵심 정보를 빠르게 표시하기 위해 사용됩니다.

  ```json
  {
    "analysis_summary": "핵심 인사이트 2-3문장 요약"
  }
  ```

  **analysis_summary (핵심 인사이트)**:
  - 전체 분석의 핵심을 2-3문장으로 요약
  - 가장 중요한 수치와 의미를 포함
  - UI에서 빠르게 표시되는 요약으로 사용됨

  ### JSON 작성 시 주의사항
  - analysis_summary는 항상 작성
  - JSON은 반드시 ```json과 ``` 사이에 작성

