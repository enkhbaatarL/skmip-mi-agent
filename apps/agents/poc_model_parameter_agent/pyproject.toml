[project]
name = "poc-model-parameter-agent"
version = "0.1.0"
description = "Deterministic LNG scenario-to-parameter learning agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "loguru>=0.7,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymysql>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30.6,<0.31",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["integration: requires a running MySQL test database"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
